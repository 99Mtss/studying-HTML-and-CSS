<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorthands para Itens</title>
    <style>
        div.container{
            border: 3px solid rgb(0, 0, 0);
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(4, 1fr);
        }

        div.caixa1{
            background-color: rgb(238, 255, 0);

            /* SHORTHANDS 1*/
            grid-row: 1 / 2;
            grid-column: 1 / 5;
            
            /* SHORTHANDS 2*/
            grid-area: 1 / 1 / 2 /5;
        }
        div.caixa2{
            background-color: rgb(118, 0, 253);

            /* SHORTHANDS 1*/
            grid-row: 2 / 4;
            grid-column: 1 / 5;

            /* SHORTHANDS 2*/
            grid-area: 2 / 1/ 4/ 5;
        }
        div.caixa3{
            background-color: rgb(0, 253, 240);

            /* SHORTHANDS 1*/
            grid-row: 2 / 4;
            grid-column: 3 / 5;
            
            /* SHORTHANDS 2*/
            grid-area: 2/ 3/ 4/ 5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1"></div>
        <div class="caixa2"></div>
        <div class="caixa3"></div> 
    </div>
</body>
</html>
