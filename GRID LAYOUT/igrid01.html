<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propriedades de itens para Grids (parte 1)</title>
    <style>
        div.container{
            border: 3px solid rgb(0, 0, 0);
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(4, 1fr);
        }

        div.caixa1{
            background-color: blue;
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 5;
        }
        div.caixa2{
            background-color: rgba(253, 0, 0, 0.658);
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;
            
        }
        div.caixa3{
            background-color: rgba(21, 253, 0, 0.658);
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1"></div>
        <div class="caixa2"></div>
        <div class="caixa3"></div> 
    </div>
</body>
</html>
