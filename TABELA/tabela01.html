<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela teste</title>
    <style>

        /* CONFIGURAÇÃO DE FORMATO */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }


        /* CONFIGURAÇÃO DE CONTEUDO */
        td{
            border: 1px solid black;
            padding: 8px;

            /* ALINHAMENTO HORIZONTAL(LEFT, RIGHT E CENTER) */
            text-align:center;
            /* ALINHAMENTO VERTICAL(TOP, MIDDLE E BOTTOM) */
            vertical-align: middle;
        }


        /* CONFIGURAÇÃO DE CORES */
        tr.linha{
            background-color:green
        }        
        td.dado{
            background-color: red;
        }
        td.dado1{
            background-color: green;
        }
        td.dado2{
            background-color: yellow
        }
    </style>
</head>
<body>
    <h1>Minhas Notas</h1>

    <!-- HIERAQUIA DE TABELA -->
    <!-- TABLE= tabela
            TABLE ROW= linha de tabela
                TABLE HEADER= cabeçalho de tabela 
                TABLE DATA= DADO DE TABELA-->

    <table>
        <tr>
            <td>Português</td>
            <td>Matetematica</td>
            <td>ED.fisica</td>
        </tr>
        <!-- PRIMEIRA LINHA  -->
        <tr> 
            <td>1,1</td>
            <td>2,5</td>
            <td>5</td>
        </tr>
        <!-- SEGUNDA LINHA -->
        <tr>
            <td>6</td>
            <td class="dado2">4</td>
            <td>6</td>
        </tr>
        <!-- TERCEIRA LINHA -->
        <tr>
            <td class="dado1">5,5</td>
            <td>4,5</td>
            <td class="dado1">6</td>
        </tr>
        <!-- QUARTA LINHA -->
        <tr>
            <td>3,5</td>
            <td class="dado">1,5</td>
            <td class="dado">0</td>
        </tr>
    </table>
    <h2>Resultados: </h2>
</body>
</html>
