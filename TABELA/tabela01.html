<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela teste</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            border-collapse: collapse;
        }
        tr.linha{
            background-color:green
        }
        td{
            border: 1px solid black;
            padding: 8px;
        }
        td.dado{
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Minhas Notas</h1>

    <!-- HIERAQUIA DE TABELA -->
    <!-- TABLE= tabela
            TABLE ROW= linha de tabela
                TABLE HEADER= cabeçalho de tabela 
                TABLE DATA= DADO DE TABELA-->

    <table>
        <tr>
            <td>Português</td>
            <td>Matetematica</td>
            <td>ED.fisica</td>
        </tr>
        <!-- PRIMEIRA LINHA  -->
        <tr> 
            <td>1,1</td>
            <td>2,5</td>
            <td>5</td>
        </tr>
        <!-- SEGUNDA LINHA -->
        <tr class="linha">
            <td>6</td>
            <td>4</td>
            <td>6</td>
        </tr>
        <!-- TERCEIRA LINHA -->
        <tr class="linha">
            <td>5,5</td>
            <td>3</td>
            <td>6</td>
        </tr>
        <!-- QUARTA LINHA -->
        <tr>
            <td>3,5</td>
            <td class="dado">1,5</td>
            <td class="dado">0</td>
        </tr>
    </table>
    <h2>Resultados: </h2>
</body>
</html>
