<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas completas</title>
        <style>
        /* CONFIGURAÇÃO DE CONTEUDO */
        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }
        h1{
            background-color: aqua;
            text-align: center;
        }

        /* CONFIGURAÇÃO DE TABELA */
        table{
            border-collapse: collapse;
            width: 300px;
            margin: auto;
        }
        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        /* CONFIGURAÇÃO DE DADOS */
        td,th{
            border: 1px solid grey;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Exercicio de tabelas</h1>
    <table>
        <caption>
             FILMES FAVORITOS
        </caption>
        <thead>
            <tr>
                <th scope="col">Grupos</th>
                <th scope="col">Nomes</th>
                <th colspan="3" scope="colgroup">Filmes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup">MULHERES</th>
                <td>Maria</td>
                <td>Eduarda</td>
                <td> Dos</td>
                <td>Santos</td>
            </tr>
            <tr>
                <td>Mariana</td>
                <td>Marques</td>
                <td>ferreira</td>
                <td> Silva</td>
            </tr>
            <tr>
                <td>Gabrielly</td>
                <td>De</td>
                <td>Souza</td>
                <td>Freitas</td>
            </tr>
            <tr>
                <th rowspan="3" scope="rowgroup">HOMENS</th>
                <td>Thays</td>
                <td>Matias</td>
                <td>silva</td>
                <td>santos</td>
            </tr>
            <tr>
                <td>Thays</td>
                <td>Matias</td>
                <td>silva</td>
                <td>santos</td>
            </tr>
            <tr>
                <td>Thayara</td>
                <td>Sabino</td>
                <td>Ferreira</td>
                <td>Santos</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
