<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Estudando Iframes</title>
    <style>
        body{
            text-align: center;
        }
        iframe{
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>
        Testando o uso de iframe
    </h1>

    <!-- LINK DANDO CERTO -->
    <P>
        Acesse Meu canal na
        <!-- TAMANHO PADRÃO DO IFRAME 300x150 -->
        <iframe src="https://www.kick.com/" frameborder="0"></iframe>
        para ve minhas Lives
    </P>

    <!-- CASO O LINK NÃO DE CERTO -->
    <P>
        Acesse meus repositorios       
        <iframe src="https://github.com/99Mtss" frameborder="0">
            no <a href="https://github.com/99Mtss" target="_blank">GITHUB</a>
        </iframe>
        para ve meus codigos
    </P>
</body>
</html>
