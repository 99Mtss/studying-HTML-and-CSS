<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de células</title>
    <style>
        /* CONFIGURAÇÃO DE CONTEUDO */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        /* CONFIGURAÇÃO DE TABELA */
        table{
            border-collapse: collapse;
            width: 300px;
        }

        /* CONFIGURAÇÃO DE DADOS */
        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Células mescladas</h1>
    <table>
        <tr>
            <td>M</td>
            <td colspan="2">A</td>
        </tr>
        <tr>
            <td>I</td>
            <td rowspan="3">A</td>
            <td>E</td>
        </tr>
        <tr>
            
            <td>U</td>
            <td>A</td>
        </tr>
        <tr>
            
            <td>D</td>
            <td>A</td>
        </tr>
    </table>
</body>
</html>
