<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste do segundo formulario</title>
    <style>
        h1{
            font-family:Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 10px;
        }
        form{
            font-family: Arial, Helvetica, sans-serif;
            text-align:center;
            margin: 0 auto;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Formulario Para Resultado das Prova</h1>
    <form action="" method="get" autocomplete="on">
        <!-- LABEL DE NOME -->
        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" required maxlength="30" 
            placeholder="Nome Completo" autocomplete="namme" size="15">
        </p>
        <!-- LABEL MÉDIA -->
        <p>
            <label for="imedia">Média: </label>
            <input type="number" name="media" id="imedia" required min="0" max="10"
            placeholder="0 a 10" step="0,5">
        </p>
        <!-- LABEL DA NOTA -->
        <p>
            <label for="hora">Hora da Prova</label>
            <input type="time" name="hora" id="ihora" >
        </p>
        <!-- LABEL DO DIA -->
        <p>
            <label for="idia">Dia da Prova</label>
            <input type="date" name="dia" id="idia" required>
        </p>
        <!-- LABEL DO MÊS/ANO -->
        <p>
            <label for="imes">Periodo Letivo</label>
            <input type="month" name="mes" id="imes" required>
        </p>
        <!-- LABEL ENVIAR/LIMPAR -->
        <P>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </P>
    </form>
</body>
</html>
