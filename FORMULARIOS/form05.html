<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckBox/RadioButtom</title>
    <style>
        h1{
            font-family: Arial, Helvetica, sans-serif;
            text-align:center;
            background-color:aqua
        }
    </style>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas">
            <label for="isxmas">Masculino</label> <br>
            <input type="radio" name="sexo" id="isxfem">
            <label for="isxfem">Feminino</label> <br>
        </fieldset>

        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox"name="esbas" id="iesbas">
            <label for="iesbas">Basquete</label> <br>

            <input type="checkbox"name="esfut" id="iesfut">
            <label for="iesfut">Futebol</label> <br>

            <input type="checkbox"name="esvol" id="iesvol">
            <label for="iesvol">Volei</label> <br>

            <input type="checkbox"name="eshan" id="ieshan">
            <label for="ieshan">Handebol</label> <br>

            <input type="checkbox"name="essal" id="iessal">
            <label for="iessal">Fustsal</label> <br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
