<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URl</title>
    <style>
        /* LOCALIZAÇÃO DAS IMAGENS NA TELA  */
        
        div.bloco{
            
            background-repeat: no-repeat;
            background-image: url(EU200.jpeg);
            height: 200px;
            border: 1px solid rgba(21, 4, 255, 0.651);
            border-radius: 10px;
            margin: 10px;
        }
        div#q1{
            background-color: rgba(48, 117, 245, 0.808);
            height: 200px;
            background-position: left top;           
        }
        div#q2{
            background-color: rgba(48, 117, 245, 0.808);
            background-image: url(rosa.png);
            background-position: center center;           
        }
        div#q3{
            background-position: right;
            background-color: rgba(48, 117, 245, 0.808)           
        }
       
        /* CENTRALIZAR UMA UNICA IMAGEM NA TELA  */
        body{
            background-color: rgba(101, 151, 245, 0.822);
            
        }
         h1{
            color: rgb(25, 0, 253);
            text-align: center;
         }


         
    </style>
</head>
<body>
    <h1>LEFT (ESQUERDA)</h1>
    
    <div class="bloco" id="q1">
       
    </div>
    <h1>CENTER (CENTRO)</h1>
    <div class="bloco" id="q2">
        
    </div>
    <h1>RIGHT (DIREITA)</h1>
    <div class="bloco" id="q3">
       
    </div>

</body>
</html>
