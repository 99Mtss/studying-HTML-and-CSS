<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>
    <style>
        h1{ 
            /* BOX-LEVEL */

            background-color: green;
            text-align: center;

                /* ALTURA (BOX-SIZE) */
            height: 300px;

                /* LARGURA (BOX-SIZE) */
            width: 300px;

                /* BORDAS DO CONTEUDO */
            /* border-width: 10px;
            border-style: solid;
            border-color: yellow; */

            /* SIMPLICADO (SHORTHANDS) */
            border: 10px solid green;


                /* TAMANHO DO CONTEUDO DE DENTRO */
            /* padding-top: 10px;
            padding-right : 10px;
            padding-bottom: 10px;
            padding-left: 10px; */
            
            /* SIMPLICADO (SHORTHANDS) */
            padding: 10px;


                /* TAMANHO DO CONTEUDO DE FORA */
            /* margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 40px;
            margin-left: 10px; */

            /* SIMPLICADO (SHORTHANDS) */
            margin: 10px auto 40px auto;


                /* LINHAS TRAÇEJADA AO REDOR */
            /* outline-width: 5px;
            outline-style: dashed;
            outline-color: red; */

            /* SIMPLICADO (SHORTHANDS) */
            outline: 5px dashed red;
        }

        a{
            /* INLINE-LEVEL */
            border-width: 10px;
            border-style: solid;
            border-color: red;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
        p{
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- BOX-LEVEL -->
    <h1>Exemplos de caixas Box-Level</h1>
    <P>Paragrafos tambem são Exemplos de caixas box-level , mas os <A href="#">Links são exemplos de caixas in-lines</A> Vamos ver como tudo isso funciona </P>
</body>
</html>
