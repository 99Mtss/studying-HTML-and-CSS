<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* CONFIGURAÇÃO DE CONTEUDO */
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        /* CONFIGURAÇÃO DE TABELA */
        table.tabela{
            border-collapse: separate;
            width: 300px;
            margin: auto;
        }

        /* CONFIGURAÇÃO DE DADOS */
        td{
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }
        h1{
            background-color: brown;
        }
    </style>
</head>
<body>
    <h1>Tabela 1</h1>
    <table class="tabela">
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
            <td>4</td>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>4</td>
        </tr>
        <tr>
            <td colspan="3">1</td>
            <td>4</td>
        </tr>
        <tr>
            <td rowspan="2">1</td>
            <td colspan="2">2</td>
            <td>4</td>
        </tr>
        <tr>
            <td>2</td>
            <td>3</td>
            <td>4</td>
        </tr>
    </table>

    <h1>Tabela 2</h1>
        <table class="tabela">
            <tr>
                <td colspan="3">1</td>
                <td rowspan="4">4</td>
            </tr>
            <tr>
                <td rowspan="4">1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td colspan="4">2</td>
            </tr>
        </table>

</body>
</html>
